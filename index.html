<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#04070c">
<meta name="description" content="AU MICROSCOPII · 2287 — браузерная НФ-RPG на станции R-7">
<title>AU Microscopii · 2287</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffb457'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%236fe3ff' stroke-opacity='.5'/%3E%3C/svg%3E">
<style>
:root{
  --pad:28px; --gap:16px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --t:.28s; --t-fast:.16s; --t-slow:.6s; --spin:240s;
  --font-ui:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",Consolas,monospace;
  --bg-0:#04070c; --ink:#e9f1fa; --ink-2:#c6dcf0;
  --dim:#7f9ab4; --dim-2:#5b7288;
  --line:rgba(140,200,255,.18); --line-2:rgba(140,200,255,.10);
  --amber:#ffb457; --amber-soft:#ffd8a8; --amber-glow:rgba(255,180,87,.12);
  --cyan:#6fe3ff; --green:#59ffb0; --red:#ff6a4a;
}
</style>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/title.css">
<link rel="stylesheet" href="css/ui-plus.css">
</head>
<body>
<div class="stage" id="stage">
  <div class="bg" id="bg"><div class="bg__spin" id="bgSpin"></div></div>
  <div class="scene" id="sceneA"></div>
  <div class="scene" id="sceneB"></div>
  <div class="core"></div>
  <div class="flare"></div>
  <canvas class="dust" id="dust"></canvas>
  <div class="sweep"></div>
  <div class="scrim"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="grain"></div>
  <div class="veil"></div>

  <header class="hud" id="hud">
    <div class="brand">
      <span class="brand__dot"></span>
      <span>AU MIC</span>
      <span class="brand__sep">/</span>
      <span class="brand__sub">R-7</span>
      <span class="brand__sep">·</span>
      <span class="brand__sub" id="hudScene">СЕКТОР R-7</span>
    </div>
    <div class="hud__where" id="hudWhere"></div>
    <div class="hud__stats">
      <span class="stat"><b>HP</b><span id="hudHp">0</span><i class="of" id="hudHpMax">/0</i></span>
      <span class="stat"><b>LVL</b><span id="hudLvl">1</span></span>
      <span class="stat"><b>XP</b><span class="xpbar"><i id="hudXpFill" style="width:0%"></i></span><i id="hudXpText">0/0</i></span>
      <span class="stat"><b>₡</b><span id="hudCredits">0</span></span>
      <span class="pill pill--amber hidden" id="hudPoints" role="button" tabindex="0">очки</span>
      <span class="hud__audio">
        <button class="btn btn--sm btn--ghost" id="btnMusic" type="button" title="Плеер" aria-label="Плеер">
          <span class="mbtn__eq" aria-hidden="true"><i></i><i></i><i></i></span><span>♫</span>
        </button>
        <button class="btn btn--sm btn--ghost" id="btnMute" type="button" title="Звук вкл/выкл (M)">ЗВУК</button>
      </span>
      <span class="hud__btns">
        <button class="btn btn--sm" id="btnSave" type="button" data-test="save">Сохранить</button>
        <button class="btn btn--sm" id="btnLoad" type="button" data-test="load">Загрузить</button>
        <button class="btn btn--sm" id="btnJournal" type="button" data-test="journal">Журнал</button>
        <button class="btn btn--sm" id="btnBag" type="button" data-test="bag">Рюкзак</button>
        <button class="btn btn--sm btn--primary" id="btnPause" type="button" data-test="pause">Пауза</button>
      </span>
    </div>
  </header>

  <main class="app" id="app"></main>
  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="amb" preload="none"></audio>
</div>

<noscript><div style="padding:40px;font:14px monospace;color:#ffb457">Для игры нужен JavaScript.</div></noscript>

<script src="js/data.js"></script>
<script src="js/data-quests.js"></script>
<script src="js/data-dialogues.js"></script>
<script src="js/logic.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/screens-shell.js"></script>
<script src="js/screens-talk.js"></script>
<script src="js/screens-char.js"></script>
<script src="js/screens-fight.js"></script>
<script src="js/main.js"></script>
</body>
</html>
